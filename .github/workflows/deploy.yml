name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Permite que el bot de GitHub tenga permisos para hacer push a la rama gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas de calidad (Oxlint)
        run: npm run lint

      - name: Compilar aplicación
        run: npm run build

      - name: Desplegar a GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Esta acción por defecto crea un commit en gh-pages incluyendo
          # el mensaje original del commit que hiciste en main.
